[project]
name = "payments-fraud-streaming"
version = "0.1.0"
description = "Real-time payment fraud detection: Kafka -> PyFlink -> Postgres/Grafana"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# PyFlink's generated code lives in the image, not the repo.
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Rules and anomaly logic are importable as top-level packages during tests.
pythonpath = [".", "producer", "flink_jobs"]
addopts = "-q"
