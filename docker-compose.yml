# payments-fraud-streaming -- full local stack, no cloud accounts.
#   docker compose up -d
# Every env var has an inline default, so a .env file is optional.
#
# Host ports: Kafka 29092 | Kafka UI 8082 | Flink UI 8081 | Postgres 5432 | Grafana 3000
# (Kafka UI is on 8082 rather than the usual 8080 to avoid colliding with other
#  local projects; change the left-hand side of the mapping if you prefer.)

name: payments-fraud-streaming

services:
  # ---------------------------------------------------------------- Kafka ----
  # KRaft mode: the broker is its own controller, so there is no Zookeeper.
  kafka:
    image: confluentinc/cp-kafka:7.9.10
    container_name: pfs-kafka
    ports:
      - "29092:29092"          # host -> broker (use localhost:29092 from Windows)
    environment:
      # A KRaft cluster needs a stable ID; fixed here so restarts reuse the volume.
      CLUSTER_ID: MkU3OEVCNTcwNTFENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: one for containers (kafka:9092), one for the host
      # (localhost:29092). Clients are redirected to whichever they connected on.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker, so nothing can be replicated more than once.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # One-shot: create the two topics, then exit 0. Topic config lives in git
  # instead of relying on auto-creation (which would give a single partition).
  kafka-init:
    image: confluentinc/cp-kafka:7.9.10
    container_name: pfs-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TOPIC_TRANSACTIONS: ${TOPIC_TRANSACTIONS:-transactions}
      TOPIC_ALERTS: ${TOPIC_ALERTS:-fraud-alerts}
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-3}
    # Exec form: the script is one argv element, so YAML preserves its newlines.
    # $$ stops Compose from interpolating the shell's own variables.
    command:
      - bash
      - -c
      - |
        set -e
        for t in "$$TOPIC_TRANSACTIONS" "$$TOPIC_ALERTS"; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t" --partitions "$$TOPIC_PARTITIONS" --replication-factor 1
        done
        echo "--- topics ---"
        kafka-topics --bootstrap-server kafka:9092 --describe
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: pfs-kafka-ui
    ports:
      - "8082:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  # ------------------------------------------------------------- Producer ----
  producer:
    build: ./producer
    container_name: pfs-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_TRANSACTIONS: ${TOPIC_TRANSACTIONS:-transactions}
      EVENTS_PER_SEC: ${EVENTS_PER_SEC:-20}
      NUM_CARDS: ${NUM_CARDS:-500}
      SEED: ${SEED:-42}
      RUN_SECONDS: ${RUN_SECONDS:-0}
      ANOMALY_RATE: ${ANOMALY_RATE:-0.02}
      LABELS_PATH: /data/labels.jsonl
      VELOCITY_MAX_TXNS: ${VELOCITY_MAX_TXNS:-5}
      VELOCITY_BURST_SPREAD_SEC: ${VELOCITY_BURST_SPREAD_SEC:-8}
      AMOUNT_THRESHOLD_CAD: ${AMOUNT_THRESHOLD_CAD:-5000}
      TRAVEL_GAP_SEC: ${TRAVEL_GAP_SEC:-90}
    volumes:
      # Bind mount (not a named volume) so evaluate.py and the host can
      # both read the ground-truth labels the simulator writes.
      - ./data:/data
    restart: unless-stopped

  # ------------------------------------------------------------- Postgres ----
  postgres:
    image: postgres:17-alpine
    container_name: pfs-postgres
    ports:
      - "5432:5432"          # psql from the host if you want to poke around
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud}
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs ONCE, only when the data directory is empty. After editing
      # init.sql you need `docker compose down -v` for it to re-run.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud} -d ${POSTGRES_DB:-fraud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------- Flink ----
  # JobManager, TaskManager and a one-shot submitter all share one image, built
  # from ./flink_jobs: Flink 1.20.5 + PyFlink + the Kafka/JDBC connector JARs.
  flink-jobmanager:
    build: ./flink_jobs
    image: pfs-flink
    container_name: pfs-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"          # Flink Web UI
    environment:
      # Memory stays modest so the whole stack fits a default 8GB Docker
      # Desktop allocation alongside Kafka, Postgres and Grafana.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1200m
        state.checkpoints.dir: file:///tmp/flink-checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  flink-taskmanager:
    build: ./flink_jobs
    image: pfs-flink
    container_name: pfs-flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///tmp/flink-checkpoints

  # One-shot: submits the job and exits, so `docker compose up` ends with a
  # RUNNING job and no manual step.
  flink-submit:
    build: ./flink_jobs
    image: pfs-flink
    container_name: pfs-flink-submit
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      JOBMANAGER_HOST: flink-jobmanager
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC_TRANSACTIONS: ${TOPIC_TRANSACTIONS:-transactions}
      TOPIC_ALERTS: ${TOPIC_ALERTS:-fraud-alerts}
      FLINK_PARALLELISM: ${FLINK_PARALLELISM:-2}
      WATERMARK_LATENESS_SEC: ${WATERMARK_LATENESS_SEC:-5}
      VELOCITY_WINDOW_SEC: ${VELOCITY_WINDOW_SEC:-60}
      VELOCITY_MAX_TXNS: ${VELOCITY_MAX_TXNS:-5}
      AMOUNT_THRESHOLD_CAD: ${AMOUNT_THRESHOLD_CAD:-5000}
      TRAVEL_WINDOW_SEC: ${TRAVEL_WINDOW_SEC:-600}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fraud}
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud}
    command: ["/opt/pfs/submit.sh"]
    restart: "no"

volumes:
  kafka-data:
  postgres-data:
