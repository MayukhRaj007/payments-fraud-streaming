name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      # No Kafka, no Flink, no Postgres. The producer's anomaly injection and
      # the fraud rules are pure functions in their own modules precisely so CI
      # can exercise the real logic without standing up the stack.
      - name: Unit tests
        run: python -m pytest -v

  compose-validates:
    name: docker compose config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Catches YAML and interpolation mistakes without pulling any images.
      # A broken compose file is the fastest way to make "one command" false.
      - name: Validate compose file
        run: docker compose config --quiet

      - name: Validate Grafana dashboard JSON
        run: python -c "import json; json.load(open('grafana/dashboards/fraud.json'))"
